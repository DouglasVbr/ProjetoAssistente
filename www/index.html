<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="theme-color" content="#07111f">
  <meta http-equiv="Content-Security-Policy" content="default-src 'self' data: gap: https://ssl.gstatic.com 'unsafe-eval' 'unsafe-inline'; style-src 'self' 'unsafe-inline' https://cdn.jsdelivr.net; font-src 'self' data: https://cdn.jsdelivr.net https://fonts.gstatic.com; media-src *; img-src 'self' data: content: blob:; connect-src 'self' http://10.0.2.2 http://192.168.1.63 https://*.anthropic.com https://generativelanguage.googleapis.com https://seu-dominio.com https://*.supabase.co https://cdn.jsdelivr.net; script-src 'self' 'unsafe-inline' 'unsafe-eval';">
  <title>Phennellopy — Assistente de voz</title>
  <link rel="stylesheet" href="css/framework7-bundle.css">
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/@mdi/font@6.9.96/css/materialdesignicons.min.css">
  <link rel="stylesheet" href="css/liquid-glass.css">
</head>
<body>
  <div id="app">
    <div class="view view-main">
      <div data-name="home" class="page">
        <div class="navbar">
          <div class="navbar-bg"></div>
          <div class="navbar-inner">
            <div class="title txt-primary">phennellopy.ia</div>
            <div class="right">
              <a href="/configuracoes/" class="link icon-only" aria-label="Abrir configurações"><i class="mdi mdi-cog" aria-hidden="true"></i></a>
            </div>
          </div>
        </div>

        <div class="fab fab-extended fab-center-bottom">
          <a id="btnfalar" href="#" class="btn-primary-outline" role="button" aria-label="Falar com a assistente" aria-live="polite">
            <i class="mdi mdi-microphone" aria-hidden="true"></i><div class="fab-text">Falar agora</div>
          </a>
        </div>

        <main class="page-content text-align-center">
          <section class="logo-container" aria-labelledby="home-title">
            <a href="/memorias/" class="link logo-link" aria-label="Abrir memórias">
              <img src="img/giphy.gif" alt="Logotipo animado da Phennellopy">
            </a>
            <div class="status-pill"><span class="status-dot" aria-hidden="true"></span> Pronta para ajudar</div>
          </section>
          <section class="home-intro">
            <h1 id="home-title">Converse com a sua assistente.</h1>
            <p>Toque em “Falar agora” e faça uma pergunta. Suas respostas e memórias ficam sempre ao seu alcance.</p>
          </section>
          <section class="conversation-card" aria-label="Conversa atual">
            <p id="pergunta" class="display-none pergunta-texto" aria-live="polite"></p>
            <p id="resposta" class="resposta-texto" aria-live="polite">Estou pronta. O que você gostaria de saber?</p>
          </section>
        </main>
      </div>
    </div>
  </div>
  <script src="js/lib/framework7-bundle.js"></script>
  <script src="js/lib/typed.umd.js"></script>
  <script src="js/lib/jquery-3.7.1.min.js"></script>
  <script src="src/utils/device.js"></script>
  <script src="src/utils/escape.js"></script>
  <script src="src/utils/fuzzy.js"></script>
  <script src="src/config/env.js"></script>
  <script src="src/services/api.service.js"></script>
  <script src="src/services/status.service.js"></script>
  <script src="src/services/auth.service.js"></script>
  <script src="src/services/speech.service.js"></script>
  <script src="src/services/tts.service.js"></script>
  <script src="src/services/gemini.service.js"></script>
  <script src="src/services/llm.service.js"></script>
  <script src="src/services/openjarvis.service.js"></script>
  <script src="src/repositories/memory.repository.js"></script>
  <script src="js/router.js"></script>
</body>
</html>
