
<!DOCTYPE html>
<html>
  <head>
    <!-- Required meta tags-->
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
    <meta name="apple-mobile-web-app-capable" content="yes">
    <!-- Color theme for statusbar (Android only) -->
    <meta name="theme-color" content="#2196f3">
    <!-- Content Security Policy -->
    <meta http-equiv="Content-Security-Policy" content="
      default-src 'self' data: gap: https://ssl.gstatic.com 'unsafe-eval' 'unsafe-inline';
      style-src 'self' 'unsafe-inline' https://cdn.jsdelivr.net;
      font-src 'self' data: https://cdn.jsdelivr.net https://fonts.gstatic.com;
      media-src *;
      img-src 'self' data: content: blob:;
      connect-src 'self' http://10.0.2.2 http://192.168.*.* https://*.anthropic.com https://generativelanguage.googleapis.com https://seu-dominio.com;
      script-src 'self' 'unsafe-inline' 'unsafe-eval';
    ">
    <!-- Your app title -->
    <title>phennellopy.ia</title>
    <!-- Path to Framework7 Library Bundle CSS -->
    <link rel="stylesheet" href="css/framework7-bundle.css">
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/@mdi/font@6.9.96/css/materialdesignicons.min.css">
    <!-- Path to your custom app styles-->
    <link rel="stylesheet" href="css/liquid-glass.css">
  </head>
  <body>
    <!-- App root element -->
    <div id="app">

      <!-- Your main view, should have "view-main" class -->
      <div class="view view-main">
        <!-- Initial Page, "data-name" contains page name -->
        <div data-name="home" class="page">

          <!-- Top Navbar -->
          <div class="navbar">
            <div class="navbar-bg bg-black"></div>
            <div class="navbar-inner">
              <div class="title txt-primary">phennellopy.ia</div>
              <div class="right">
                <a href="/configuracoes/" class="link icon-only">
                  <i class="mdi mdi-cog" style="font-size: 24px;"></i>
                </a>
              </div>
            </div>
          </div>
            
          <!-- fab button -->
          <div class="fab fab-extended fab-center-bottom">
            <a id="btnfalar" href="#" class="btn-primary-outline">
                <i class="mdi mdi-microphone" style="font-size: 24px;"></i>
                <div class="fab-text">Falar</div>
            </a>
        </div>

          

          <!-- Scrollable page content -->
          <div class="page-content bg-black txt-primary text-align-center">
            <!-- Logo animado com container glass -->
            <div class="logo-container">
              <a href="/memorias/" class="link logo-link">
                <img style="max-width: 200px;" src="img/giphy.gif" alt="Phennellopy Logo">
              </a>
              <p class="logo-subtitle">Sua assistente de voz inteligente</p>
            </div>
            
            <div class="block">
              <p id="pergunta" class="display-none pergunta-texto"></p>
            </div>

            <div class="block">
              <p id="resposta" class="resposta-texto"></p>
            </div>
            
          </div>
        </div>
      </div>
    </div>
    <!-- Path to Framework7 Library Bundle JS-->
    <script type="text/javascript" src="js/lib/framework7-bundle.js"></script>
    <!-- typed JS-->
    <script type="text/javascript" src="js/lib/typed.umd.js"></script>
    <!--jQuery 3.7.1-->
    <script type="text/javascript" src="js/lib/jquery-3.7.1.min.js"></script>

    <!-- Phennellopy Services (carrega antes do router) -->
    <script type="text/javascript" src="src/utils/device.js"></script>
    <script type="text/javascript" src="src/utils/escape.js"></script>
    <script type="text/javascript" src="src/utils/fuzzy.js"></script>
    <script type="text/javascript" src="src/config/env.js"></script>
    <script type="text/javascript" src="src/services/api.service.js"></script>
    <script type="text/javascript" src="src/services/status.service.js"></script>
    <script type="text/javascript" src="src/services/auth.service.js"></script>
    <script type="text/javascript" src="src/services/speech.service.js"></script>
    <script type="text/javascript" src="src/services/tts.service.js"></script>
    <script type="text/javascript" src="src/services/gemini.service.js"></script>
    <script type="text/javascript" src="src/services/llm.service.js"></script>
    <script type="text/javascript" src="src/services/openjarvis.service.js"></script>
    <script type="text/javascript" src="src/repositories/memory.repository.js"></script>
    <script type="text/javascript" src="src/services/migration.service.js"></script>

    <!-- Path to your app js-->
    <script type="text/javascript" src="js/router.js"></script>

    <!--Cordova-->
    <script type="text/javascript" src="cordova.js"></script>

    

  </body>
</html>
