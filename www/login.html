<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="theme-color" content="#07111f">
  <title>Entrar — Phennellopy</title>
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/@mdi/font@6.9.96/css/materialdesignicons.min.css">
  <link rel="stylesheet" href="css/liquid-glass.css">
</head>
<body>
  <main class="login-page">
    <section class="login-card" aria-labelledby="login-title">
      <div class="logo"><img src="img/giphy.gif" alt="Logotipo da Phennellopy"></div>
      <h1 id="login-title">Bem-vindo de volta</h1>
      <p class="subtitle">Entre para continuar sua conversa com a Phennellopy.</p>
      <div class="button-group">
        <button class="btn" id="btnGoogle" type="button"><i class="mdi mdi-google" aria-hidden="true"></i> Continuar com Google</button>
        <button class="btn" id="btnGithub" type="button"><i class="mdi mdi-github" aria-hidden="true"></i> Continuar com GitHub</button>
        <button class="btn" id="btnPhone" type="button"><i class="mdi mdi-cellphone" aria-hidden="true"></i> Continuar com celular</button>
      </div>
      <div class="divider" aria-hidden="true">ou</div>
      <button class="btn btn-guest" id="btnGuest" type="button">Continuar sem fazer login</button>
      <div class="footer"><p>Ao continuar, você concorda com os<br><a href="#">Termos de Serviço</a> e <a href="#">Política de Privacidade</a>.</p></div>
    </section>
  </main>
  <script src="js/lib/jquery-3.7.1.min.js"></script>
  <script src="src/utils/device.js"></script>
  <script src="src/utils/escape.js"></script>
  <script src="src/config/env.js"></script>
  <script src="src/services/api.service.js"></script>
  <script src="src/services/status.service.js"></script>
  <script src="src/services/auth.service.js"></script>
  <script>
    (function () {
      function goAsGuest() { window.location.href = 'index.html'; }
      function startProviderLogin(buttonId, method, fallback) {
        $('#' + buttonId).on('click', function () {
          var button = this;
          button.disabled = true;
          if (window.Phennellopy && window.Phennellopy.Auth && window.Phennellopy.Auth[method]) {
            window.Phennellopy.Status && window.Phennellopy.Status.processing && window.Phennellopy.Status.processing('api');
            window.Phennellopy.Auth[method]().catch(function (err) {
              window.Phennellopy.Status && window.Phennellopy.Status.hide && window.Phennellopy.Status.hide();
              window.app && window.app.dialog ? window.app.dialog.alert((err && err.message) || fallback, 'Erro') : alert(fallback);
              button.disabled = false;
            });
          } else {
            alert(fallback);
            button.disabled = false;
          }
        });
      }
      startProviderLogin('btnGoogle', 'loginWithGoogle', 'Login com Google indisponível.');
      startProviderLogin('btnGithub', 'loginWithGithub', 'Login com GitHub indisponível.');
      function showError(message) {
        window.app && window.app.dialog ? window.app.dialog.alert(message, 'Não foi possível entrar') : alert(message);
      }

      function handleOAuthCallback() {
        var params = new URLSearchParams(window.location.search);
        var code = params.get('code');
        var provider = params.get('provider');
        if (!code || (provider !== 'google' && provider !== 'github')) return;
        var button = document.getElementById(provider === 'google' ? 'btnGoogle' : 'btnGithub');
        if (button) button.disabled = true;
        window.Phennellopy.Auth.handleOAuthCallback(code, provider, params.get('state'))
          .then(function () { window.location.replace('index.html'); })
          .catch(function (err) { showError(err && err.message ? err.message : 'Verifique a configuração do provedor e tente novamente.'); if (button) button.disabled = false; });
      }

      $('#btnPhone').on('click', function () {
        var phone = window.prompt('Digite seu celular com DDD (ex.: +5511999999999):');
        if (!phone) return;
        var button = this;
        button.disabled = true;
        window.Phennellopy.Auth.sendSMS(phone)
          .then(function () {
            var code = window.prompt('Enviamos um código por SMS. Digite-o para continuar:');
            if (!code) throw new Error('Código não informado.');
            return window.Phennellopy.Auth.verifySMS(phone, code);
          })
          .then(function () { window.location.replace('index.html'); })
          .catch(function (err) { showError(err && err.message ? err.message : 'Não foi possível validar o celular.'); button.disabled = false; });
      });
      $('#btnGuest').on('click', goAsGuest);
      handleOAuthCallback();
    })();
  </script>
</body>
</html>
