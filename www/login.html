<!DOCTYPE html>
<html>
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Phennellopy - Login</title>
  <style>
    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
    }

    body {
      font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
      background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
      min-height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
      color: white;
    }

    .container {
      max-width: 400px;
      width: 90%;
      text-align: center;
    }

    .logo {
      margin-bottom: 30px;
    }

    .logo img {
      width: 120px;
      height: 120px;
      border-radius: 20px;
      box-shadow: 0 10px 40px rgba(0, 0, 0, 0.3);
    }

    h1 {
      font-size: 32px;
      font-weight: 700;
      margin: 20px 0 10px;
    }

    .subtitle {
      font-size: 16px;
      opacity: 0.9;
      margin-bottom: 40px;
    }

    .button-group {
      margin-bottom: 30px;
    }

    .btn {
      display: block;
      width: 100%;
      padding: 16px;
      margin-bottom: 12px;
      background: rgba(255, 255, 255, 0.15);
      border: 1px solid rgba(255, 255, 255, 0.3);
      border-radius: 12px;
      color: white;
      font-size: 16px;
      font-weight: 600;
      cursor: pointer;
      transition: all 0.3s ease;
      backdrop-filter: blur(10px);
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 12px;
      text-decoration: none;
    }

    .btn:hover {
      background: rgba(255, 255, 255, 0.25);
      transform: translateY(-2px);
      box-shadow: 0 8px 30px rgba(0, 0, 0, 0.2);
    }

    .btn:active {
      transform: translateY(0);
    }

    .btn i {
      font-size: 20px;
    }

    .divider {
      margin: 30px 0;
      font-size: 14px;
      opacity: 0.8;
    }

    .btn-guest {
      font-size: 14px;
      text-decoration: underline;
      background: transparent;
      border: none;
    }

    .btn-guest:hover {
      background: transparent;
    }

    .footer {
      margin-top: 40px;
      font-size: 12px;
      opacity: 0.7;
    }

    .footer a {
      color: white;
      text-decoration: underline;
    }
  </style>
</head>
<body>
  <div class="container">
    <!-- Logo -->
    <div class="logo">
      <img src="img/giphy.gif" alt="Phennellopy">
    </div>

    <!-- Título -->
    <h1>Phennellopy</h1>
    <p class="subtitle">Sua assistente de voz inteligente</p>

    <!-- Botões de Login -->
    <div class="button-group">
      <button class="btn" id="btnGoogle">
        <svg width="20" height="20" viewBox="0 0 24 24">
          <path fill="#fff" d="M22.56 12.25c0-.78-.07-1.53-.2-2.25H12v4.26h5.92c-.26 1.37-1.04 2.53-2.21 3.31v2.77h3.57c2.08-1.92 3.28-4.74 3.28-8.09z"/>
          <path fill="#fff" d="M12 23c2.97 0 5.46-.98 7.28-2.66l-3.57-2.77c-.98.66-2.23 1.06-3.71 1.06-2.86 0-5.29-1.93-6.16-4.53H2.18v2.84C3.99 20.53 7.7 23 12 23z"/>
          <path fill="#fff" d="M5.84 14.09c-.22-.66-.35-1.36-.35-2.09s.13-1.43.35-2.09V7.07H2.18C1.43 8.55 1 10.22 1 12s.43 3.45 1.18 4.93l2.85-2.22.81-.62z"/>
          <path fill="#fff" d="M12 5.38c1.62 0 3.06.56 4.21 1.64l3.15-3.15C17.45 2.09 14.97 1 12 1 7.7 1 3.99 3.47 2.18 7.07l3.66 2.84c.87-2.6 3.3-4.53 6.16-4.53z"/>
        </svg>
        Continuar com Google
      </button>

      <button class="btn" id="btnGithub">
        <span>🐙</span>
        Continuar com GitHub
      </button>

      <button class="btn" id="btnPhone">
        <span>📱</span>
        Continuar com Celular
      </button>
    </div>

    <!-- Divider -->
    <div class="divider">ou</div>

    <!-- Guest Mode -->
    <button class="btn btn-guest" id="btnGuest">
      Continuar sem fazer login
    </button>

    <!-- Footer -->
    <div class="footer">
      <p>Ao continuar, você concorda com nossos<br>
      <a href="#">Termos de Serviço</a> e
      <a href="#">Política de Privacidade</a></p>
    </div>
  </div>

  <!-- Scripts -->
  <script src="js/lib/jquery-3.7.1.min.js"></script>
  <script src="src/utils/device.js"></script>
  <script src="src/utils/escape.js"></script>
  <script src="src/config/env.js"></script>
  <script src="src/services/api.service.js"></script>
  <script src="src/services/status.service.js"></script>
  <script src="src/services/auth.service.js"></script>

  <script>
    console.log('[login-novo] Iniciando...');

     // Google Login (fluxo real)
     $('#btnGoogle').on('click', function (e) {
       e.preventDefault();
       console.log('[login] Google clicado (real)');
       if (window.Phennellopy && window.Phennellopy.Auth && window.Phennellopy.Auth.loginWithGoogle) {
         window.Phennellopy.Status && window.Phennellopy.Status.processing && window.Phennellopy.Status.processing('api');
         window.Phennellopy.Auth.loginWithGoogle().catch(function (err) {
           console.error('[login] Erro Google:', err);
           if (window.Phennellopy && window.Phennellopy.Status && window.Phennellopy.Status.hide) window.Phennellopy.Status.hide();
           alert((err && err.message) ? err.message : 'Erro ao iniciar Login com Google');
         });
       } else {
         alert('Serviço de Login com Google indisponível.');
       }
     });

     // GitHub Login (fluxo real)
     $('#btnGithub').on('click', function (e) {
       e.preventDefault();
       console.log('[login] GitHub clicado (real)');
       if (window.Phennellopy && window.Phennellopy.Auth && window.Phennellopy.Auth.loginWithGithub) {
         window.Phennellopy.Status && window.Phennellopy.Status.processing && window.Phennellopy.Status.processing('api');
         window.Phennellopy.Auth.loginWithGithub().catch(function (err) {
           console.error('[login] Erro GitHub:', err);
           window.Phennellopy.Status && window.Phennellopy.Status.hide && window.Phennellopy.Status.hide();
           alert((err && err.message) ? err.message : 'Erro ao iniciar Login com GitHub');
         });
       } else {
         alert('Serviço de Login com GitHub indisponível.');
       }
     });

    // Phone Login
    $('#btnPhone').on('click', function () {
      console.log('[login] Phone clicado');
      var phone = prompt('Digite seu número:\n+55 (XX) 9XXXX-XXXX');
      if (phone) {
        alert('Código enviado para: ' + phone);
        var code = prompt('Digite o código SMS (6 dígitos):');
        if (code && code.length === 6) {
          alert('Login realizado com sucesso!');
          window.location.href = 'index.html';
        }
      }
    });

    // Guest Mode
    $('#btnGuest').on('click', function () {
      console.log('[login] Guest clicado');
      alert('Bem-vindo como convidado!');
      window.location.href = 'index.html';
    });

    console.log('[login-novo] ✅ Inicializado!');
  </script>
</body>
</html>
